<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sing at The Dive</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&family=Outfit:wght@400;500;600&display=swap">
<style>
:root{--wall:#0a0c0a;--panel:#131713;--panel-2:#1b211b;--line:#2b352b;--green:#39b54a;--green-hi:#5fd36e;--ink:#eef3ee;--ink-2:#9fae9f;--warn:#ff6b6b;
--slab:"Roboto Slab",Rockwell,Georgia,serif;--body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
.logo{display:block;width:150px;max-width:50%;margin:0 auto;filter:drop-shadow(0 0 22px rgba(57,181,74,.55))}
h1{font-family:var(--slab);font-weight:800;font-size:30px;line-height:1.1;margin:0;text-align:center;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:15px;color:var(--ink-2);margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
label{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
label span{text-transform:none;letter-spacing:0}
input{width:100%;background:var(--wall);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 12px;font:inherit;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid var(--green-hi);outline-offset:2px}
.field{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button b{font-weight:500}
.sugg button span{display:block;font-size:13px;color:var(--ink-2)}
.go{width:100%;background:var(--green);color:#041206;border:0;border-radius:999px;padding:15px;font-family:var(--slab);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.go[disabled]{opacity:.6}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:0}
.spot{text-align:center}
.spot .num{font-family:var(--slab);font-weight:800;font-size:64px;line-height:1;color:var(--green-hi)}
.spot .song{font-size:18px;font-weight:500}
.spot p{margin:4px 0;color:var(--ink-2)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer;align-self:center}
h2{font-family:var(--slab);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-hi);margin:0}
ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .n{font-family:var(--slab);font-weight:800;color:var(--ink-2);width:26px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
li .t{min-width:0;flex:1}
li .t b{display:block;font-weight:500;overflow-wrap:anywhere}
li .t span{display:block;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
li.up{background:rgba(57,181,74,.14)}
li.up .n{color:var(--green-hi)}
li.me .t b::after{content:" · you";color:var(--green-hi);font-weight:400}
.empty{padding:14px;color:var(--ink-2);text-align:center}
.closed{text-align:center;color:var(--ink-2)}
</style>
</head>
<body>
<main>
  <img class="logo" src="/logo.png" alt="The Dive on 495, Bar + Stage, McAllen, TX">
  <h1>Sign up to sing<small>Anótate para cantar</small></h1>

  <section class="card" id="formCard">
    <form id="form" novalidate>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label for="name">Your name <span>/ Tu nombre</span></label>
          <input id="name" name="name" maxlength="30" autocomplete="given-name" placeholder="Maria" required>
        </div>
        <div class="field">
          <label for="song">Song <span>/ Canción</span></label>
          <input id="song" name="song" maxlength="80" autocomplete="off" placeholder="Bidi Bidi Bom Bom" required>
          <div class="sugg" id="sugg" hidden></div>
        </div>
        <div>
          <label for="artist">Artist <span>/ Artista</span></label>
          <input id="artist" name="artist" maxlength="60" autocomplete="off" placeholder="Selena">
        </div>
        <p class="err" id="err" role="alert"></p>
        <button class="go" id="submit" type="submit">Put me on the list</button>
      </div>
    </form>
  </section>

  <section class="card spot" id="mineCard" hidden>
    <div class="num" id="mineNum"></div>
    <p id="mineLine"></p>
    <div class="song" id="mineSong"></div>
    <p>Keep this page open. It updates on its own.</p>
    <button class="ghost" id="cancel" type="button">Cancel my song</button>
  </section>

  <section class="card closed" id="closedCard" hidden>
    <p>Sign-ups are closed right now. Ask the KJ.</p>
  </section>

  <section class="card">
    <h2>Up next</h2>
    <ol id="queue"><li class="empty">Nobody's signed up yet. Be the first.</li></ol>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let songs = [], mine = null, buzzed = false;
fetch("/songs.json").then(r => r.json()).then(s => songs = s).catch(() => {});

function suggest(){
  const q = $("song").value.trim().toLowerCase(), box = $("sugg");
  if(q.length < 2 || !songs.length){ box.hidden = true; return; }
  const hits = songs.filter(s => s.t.toLowerCase().includes(q) || s.a.toLowerCase().includes(q)).slice(0, 6);
  box.innerHTML = "";
  hits.forEach(s => {
    const b = document.createElement("button"); b.type = "button";
    const t = document.createElement("b"); t.textContent = s.t;
    const a = document.createElement("span"); a.textContent = s.a;
    b.append(t, a);
    b.addEventListener("click", () => { $("song").value = s.t; $("artist").value = s.a; box.hidden = true; $("err").textContent = ""; });
    box.appendChild(b);
  });
  box.hidden = !hits.length;
}
$("song").addEventListener("input", () => { $("err").textContent = ""; suggest(); });
$("name").addEventListener("input", () => { $("err").textContent = ""; });
document.addEventListener("click", e => { if(!e.target.closest(".field")) $("sugg").hidden = true; });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("name").value.trim(), song = $("song").value.trim(), artist = $("artist").value.trim();
  if(!name){ $("err").textContent = "Enter your name or stage name."; $("name").focus(); return; }
  if(!song){ $("err").textContent = "Enter the song you want to sing."; $("song").focus(); return; }
  $("submit").disabled = true; $("submit").textContent = "Adding you…";
  try{
    const r = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, song, artist }) });
    const j = await r.json();
    if(!r.ok){ $("err").textContent = j.error || "Couldn't add you. Try again."; }
    else { try{ localStorage.setItem("dive_name", name); }catch(e){} }
  }catch(e){ $("err").textContent = "No connection. Check your signal and try again."; }
  $("submit").disabled = false; $("submit").textContent = "Put me on the list";
  refresh();
});

$("cancel").addEventListener("click", async () => {
  if($("cancel").dataset.armed !== "1"){ $("cancel").dataset.armed = "1"; $("cancel").textContent = "Tap again to cancel"; setTimeout(() => { $("cancel").dataset.armed = ""; $("cancel").textContent = "Cancel my song"; }, 4000); return; }
  await fetch("/api/cancel", { method: "POST" }).catch(() => {});
  $("cancel").dataset.armed = ""; $("cancel").textContent = "Cancel my song"; refresh();
});

function render(data){
  mine = data.mine;
  $("closedCard").hidden = data.open || !!mine;
  $("formCard").hidden = !!mine || !data.open;
  $("mineCard").hidden = !mine;
  if(mine){
    const ahead = mine.spot;
    $("mineNum").textContent = mine.status === "up" ? "You're up!" : "#" + (ahead + 1);
    $("mineLine").textContent = mine.status === "up" ? "Head to the stage." : ahead === 0 ? "You're next." : ahead === 1 ? "1 singer before you." : ahead + " singers before you.";
    $("mineSong").textContent = mine.song + (mine.artist ? " – " + mine.artist : "");
    if(mine.status === "up" && !buzzed && navigator.vibrate){ navigator.vibrate([200, 100, 200]); buzzed = true; }
  }
  const ol = $("queue"); ol.innerHTML = "";
  if(!data.queue.length){ const li = document.createElement("li"); li.className = "empty"; li.textContent = "Nobody's signed up yet. Be the first."; ol.appendChild(li); return; }
  data.queue.slice(0, 25).forEach((r, i) => {
    const li = document.createElement("li"); if(r.status === "up") li.classList.add("up"); if(mine && r.id === mine.id) li.classList.add("me");
    const n = document.createElement("span"); n.className = "n"; n.textContent = r.status === "up" ? "▶" : i + 1;
    const t = document.createElement("div"); t.className = "t";
    const b = document.createElement("b"); b.textContent = r.name;
    const s = document.createElement("span"); s.textContent = r.song + (r.artist ? " – " + r.artist : "");
    t.append(b, s); li.append(n, t); ol.appendChild(li);
  });
}
async function refresh(){
  try{ const r = await fetch("/api/queue", { cache: "no-store" }); render(await r.json()); }catch(e){}
}
try{ const n = localStorage.getItem("dive_name"); if(n) $("name").value = n; }catch(e){}
refresh(); setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") refresh(); });
</script>
</body>
</html>
